[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpathogen"
version = "0.0.0"
description = "Research code for controllable H&E counterfactual generation and pathology-model probing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
preprocessing = [
    "joblib>=1.3",
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "pyarrow>=12",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
