[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpathogen"
version = "0.0.0"
description = "Research code for controllable H&E counterfactual generation and pathology-model probing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
inference = [
    "accelerate>=0.30,<2",
    "diffusers==0.30.2",
    "numpy>=1.24,<3",
    "pandas>=2.0",
    "Pillow>=10",
    "pyarrow>=12",
    "safetensors>=0.4",
    "scipy>=1.10",
    "torch>=2.2,<3",
    "tqdm>=4.65",
    "transformers>=4.39,<5",
]
probe = [
    "joblib>=1.3",
    "numpy>=1.24,<3",
    "pandas>=2.0",
    "Pillow>=10",
    "pyarrow>=12",
    "scikit-learn>=1.3,<2",
    "timm_ctp==0.5.4",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "tqdm>=4.65",
]
endpoints = [
    "einops>=0.7",
    "huggingface-hub>=0.24,<1",
    "joblib>=1.3",
    "nystrom-attention>=0.0.12",
    "numpy>=1.24,<3",
    "pandas>=2.0",
    "Pillow>=10",
    "pyarrow>=12",
    "scikit-learn>=1.3,<2",
    "scipy>=1.10",
    "timm>=1.0,<2",
    "timm_ctp==0.5.4",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "tqdm>=4.65",
]
cloud = [
    "google-cloud-storage>=2,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
