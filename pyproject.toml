[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cpathogen"
version = "0.0.0"
description = "Research code for controllable H&E counterfactual generation and pathology-model probing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
annotation = [
    "einops>=0.6",
    "numba>=0.59",
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8",
    "Pillow>=10",
    "scikit-image>=0.21",
    "scipy>=1.10",
    "timm>=1.0,<2",
    "torch>=2.2,<3",
]
preprocessing = [
    "joblib>=1.3",
    "numpy>=1.24,<3",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "pyarrow>=12",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tqdm>=4.65",
]
inference = [
    "accelerate>=0.30,<2",
    "diffusers==0.30.2",
    "numpy>=1.24,<3",
    "pandas>=2.0",
    "Pillow>=10",
    "pyarrow>=12",
    "safetensors>=0.4",
    "scipy>=1.10",
    "torch>=2.2,<3",
    "tqdm>=4.65",
    "transformers>=4.39,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
