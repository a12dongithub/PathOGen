schema_version: 2
status: reference_not_yet_wired
data_root: "${CPATHOGEN_DATA_ROOT:-data}"

raw:
  tcga_slides: data/raw/tcga_brca/slides
  tcga_clinical: data/raw/tcga_brca/clinical
  tcga_subtypes: data/raw/tcga_brca/molecular_subtypes.csv
  bach_images: data/raw/bach/images
  bach_labels: data/raw/bach/labels.csv
  pannuke: data/raw/pannuke

interim:
  tcga_tiles: data/interim/tiles/tcga_brca
  bach_tiles: data/interim/tiles/bach
  tcga_geojson: data/interim/annotations/tcga_brca/geojson

generator_contract:
  spatial_maps: data/processed/generator/spatial_maps
  morphology_raw: data/processed/generator/morphology_features/morphology_raw.parquet
  morphology_standardized: data/processed/generator/morphology_features/morphology_standardized.parquet
  morphology_scaler: data/processed/generator/morphology_features/scaler.joblib
  morphology_manifest: data/processed/generator/morphology_features/feature_manifest.json
  metadata: data/processed/generator/manifests/metadata.jsonl

classification:
  bach: data/processed/classification/bach
  tcga_subtypes: data/processed/classification/tcga_subtypes

spatial_map:
  height: 512
  width: 512
  channels:
    - Neoplastic
    - Inflammatory
    - Connective
    - Dead
    - Epithelial
  gaussian_sigma: 3.0

morphology_feature_order:
  - area_mean
  - area_var
  - eccentricity_mean
  - eccentricity_var
  - solidity_mean
  - solidity_var
  - perimeter_mean
  - perimeter_var
  - grad_mean
  - grad_var
  - r_mean
  - r_var
  - g_mean
  - g_var
  - b_mean
  - b_var
