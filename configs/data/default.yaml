schema_version: 2
status: active_path_and_tensor_contract
data_root: "${CPATHOGEN_DATA_ROOT:-data}"

interim:
  tcga_tiles: data/images
  tcga_geojson: data/geojsons

conditions:
  spatial_maps: data/spatial_maps
  morphology_raw: data/morphology/raw.parquet
  morphology_standardized: data/morphology_stats.parquet
  morphology_scaler: data/morphology/scaler.joblib
  morphology_manifest: data/morphology/feature_manifest.json
  metadata: data/metadata.jsonl

spatial_map:
  height: 512
  width: 512
  channels:
    - Neoplastic
    - Inflammatory
    - Connective
    - Dead
    - Epithelial
  gaussian_sigma: 3.0

morphology_feature_order:
  - area_mean
  - area_var
  - eccentricity_mean
  - eccentricity_var
  - solidity_mean
  - solidity_var
  - perimeter_mean
  - perimeter_var
  - grad_mean
  - grad_var
  - r_mean
  - r_var
  - g_mean
  - g_var
  - b_mean
  - b_var
