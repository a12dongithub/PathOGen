base_model: artifacts/models/pathogen_phase2/checkpoint_30000
initial_unet: artifacts/models/pathogen_phase1/checkpoint_30000
metadata_file: data/processed/conditions/metadata.jsonl
output_dir: artifacts/runs/phase1_domain_adapt
resolution: 512
max_train_steps: 100000
train_batch_size: 8
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
lr_scheduler: constant_with_warmup
lr_warmup_steps: 1000
checkpointing_steps: 10000
dataloader_workers: 8
mixed_precision: fp16
gradient_checkpointing: true
random_flip: true
use_8bit_adam: true
use_ema: true
ema_decay: 0.9999
max_grad_norm: 1.0
seed: 42
local_files_only: true
logging_steps: 10
