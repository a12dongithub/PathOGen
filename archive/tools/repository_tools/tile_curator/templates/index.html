<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Curator</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .images-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .image-card {
            background-color: #1e1e1e;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            text-align: center;
        }
        .image-card img.raw {
            width: 512px;
            height: 512px;
            border-radius: 8px;
            object-fit: contain;
        }
        .image-card img.spatial {
            width: 1000px; /* Make it wide enough to show 5 subplots */
            height: auto;
            border-radius: 8px;
            object-fit: contain;
        }
        .controls {
            display: flex;
            gap: 20px;
        }
        button {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-bad {
            background-color: #d32f2f;
            color: white;
        }
        .btn-good {
            background-color: #388e3c;
            color: white;
        }
        .hint {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Dataset Image Curation</h1>
        <p>Remaining: <span id="remaining-count">Loading...</span> | Current Class: <span id="current-label">-</span></p>
    </div>

    <div class="images-container" id="images">
        <div class="image-card">
            <h3>Raw RGB</h3>
            <img class="raw" id="raw-img" src="" alt="Raw Image">
        </div>
        <div class="image-card">
            <h3>Extracted Spatial Map</h3>
            <img class="spatial" id="spatial-img" src="" alt="Spatial Map">
        </div>
    </div>

    <div class="controls">
        <button class="btn-bad" id="btn-bad">BAD (Left Arrow)</button>
        <button class="btn-good" id="btn-good">GOOD (Right Arrow)</button>
    </div>

    <div class="hint">Use your Left and Right arrow keys to quickly curate images.</div>
    <div class="loading" id="loading">Loading...</div>

    <script>
        let currentImage = null;
        let isProcessing = false;

        async function loadNextImage() {
            try {
                const response = await fetch('/api/next_image');
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('images').innerHTML = `<h2>${data.error}</h2>`;
                    return;
                }

                currentImage = data;
                document.getElementById('remaining-count').innerText = data.remaining;
                document.getElementById('current-label').innerText = data.label;
                
                // Set images with cache busting
                const timestamp = new Date().getTime();
                document.getElementById('raw-img').src = `/image/raw/${data.image_name}?t=${timestamp}`;
                document.getElementById('spatial-img').src = `/image/spatial/${data.image_name}?t=${timestamp}`;
                
                isProcessing = false;
            } catch (error) {
                console.error("Error loading image:", error);
                isProcessing = false;
            }
        }

        async function submitLabel(isGood) {
            if (!currentImage || isProcessing) return;
            isProcessing = true;

            try {
                await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        image_path: currentImage.image_path,
                        image_name: currentImage.image_name,
                        label: currentImage.label,
                        is_good: isGood
                    })
                });
                
                loadNextImage();
            } catch (error) {
                console.error("Error submitting label:", error);
                isProcessing = false;
            }
        }

        document.getElementById('btn-good').addEventListener('click', () => submitLabel(1));
        document.getElementById('btn-bad').addEventListener('click', () => submitLabel(0));

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                submitLabel(1);
            } else if (e.key === 'ArrowLeft') {
                submitLabel(0);
            }
        });

        // Initial load
        loadNextImage();
    </script>
</body>
</html>
